[project]
name = "medical-guideline-rag"
version = "1.0.0"
description = "AI-powered medication advisor using RAG and medical literature"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "bio>=1.8.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.18.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.9.1",
    "pypdf2>=3.0.1",
    "transformers>=4.55.2",
    "accelerate>=1.10.0",
    "jinja2>=3.1.0",
    "networkx>=3.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "markdown>=3.8.2",
    "pip>=25.2",
    "pydantic-ai>=1.30.1",
    "pydantic-settings>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "black>=25.1.0",
    "isort>=6.0.1",
    "flake8>=7.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
